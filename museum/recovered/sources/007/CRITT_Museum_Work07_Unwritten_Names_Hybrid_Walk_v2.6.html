 // dark architectural shell and a restrained circular archive desk

 const deskRim=new THREE.Mesh(new THREE.TorusGeometry(6.9,.50,8,116),rimM);deskRim.rotation.x=Math.PI/2;deskRim.position.y=.92;deskRim.scale.set(1.005,1.005,1.005);deskRim.material.transparent=true;deskRim.material.opacity=.12;scene.add(deskRim);
 const centerCircle=new THREE.Mesh(new THREE.RingGeometry(2.15,2.17,100),new THREE.MeshBasicMaterial({color:0xbca078,transparent:true,opacity:.23,side:THREE.DoubleSide}));centerCircle.rotation.x=-Math.PI/2;centerCircle.position.y=.012;scene.add(centerCircle);
 // Subtle overhead brass runners; suspended works read as documents, not information panels.
 for(let i=-4;i<=4;i++){box([i*3.2,9.73,0],[.07,.06,31],new THREE.MeshBasicMaterial({color:0x5f5647}));}
 const texLoader=new THREE.TextureLoader();group=new THREE.Group();scene.add(group);
 const archive=[];const angles=[.22,.71,1.16,1.49,1.91,2.35,2.78,3.08,3.53,3.88,4.25,4.57,4.92,5.22,5.56,5.96, .05,1.32,3.31,5.06];
 const texturePool=slices.map(x=>{const t=texLoader.load(x.src);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=renderer.capabilities.getMaxAnisotropy();return t});

 for(let i=0;i<slices.length;i++){
  const a=angles[i],ring=i%5===0?5.25:(i%3===0?7.9:9.4); const x=Math.sin(a)*ring,z=Math.cos(a)*ring;
  const w=(slices[i].w/slices[i].h)*(i%3===0?2.45:2.05),h=i%3===0?2.45:2.05;
  const y=[3.25,4.55,5.95,3.9,6.7][i%5];
  const mat=new THREE.MeshBasicMaterial({map:texturePool[i],color:0xfaf4ec,transparent:true,opacity:.89,depthWrite:true,side:THREE.DoubleSide});
  const frame=new THREE.Group();frame.position.set(x,y,z);frame.rotation.y=a+Math.PI;

  const back=new THREE.Mesh(new THREE.PlaneGeometry(w+.07,h+.07),new THREE.MeshBasicMaterial({color:0x201e1b,side:THREE.DoubleSide}));back.position.z=-.014;frame.add(back);

 }
 // Deliberately empty suspended sheets are art, not fabricated personal records.
 emptyGroup=new THREE.Group();scene.add(emptyGroup);
 const voidSheets=[];
 for(let i=0;i<13;i++){
  const a=i*2.399963,ring=.65+Math.sqrt(i/13)*1.6;
  const x=Math.sin(a)*ring,z=Math.cos(a)*ring;
  const y=2.4+(i%4)*.78,w=.72+(i%3)*.12,h=1.14+(i%4)*.14;

 // Golden lamps at variable heights to emphasize serial archival space.
 for(let i=0;i<10;i++){
  const a=i*Math.PI*2/10,r=7.5;const x=Math.sin(a)*r,z=Math.cos(a)*r;
  let lamp=new THREE.PointLight(0xffc893,15,6,2);lamp.position.set(x,7.9,z);scene.add(lamp);lamps.push(lamp);

 }
 let yaw=0,pitch=.09,drag=false,prev={x:0,y:0};const keys=new Set();let guide=false,guideIndex=0,guidePause=0,guideMode='ring',ui=true;
 const home={x:0,z:13.4,yaw:0,pitch:.09};
 const circlePath=[
  {x:0,z:13.4,look:[0,3.7,4],pause:.5},
  {x:-7,z:7.0,look:[-5,4.3,2],pause:1.1},
  {x:-9,z:-1.4,look:[-5,4.4,-4.5],pause:1.15},
  {x:-4.8,z:-7.3,look:[0,4,0],pause:1.15},
  {x:5.4,z:-7.1,look:[4,4,0],pause:1.15},
  {x:8.3,z:1.2,look:[0,5,0],pause:1.15},
  {x:5.7,z:7.1,look:[0,4.2,0],pause:1.1}
 ];
 const centerPath=[{x:0,z:13.4,look:[0,4,1],pause:.1},{x:.1,z:8.5,look:[0,3,0],pause:.3},{x:.1,z:4.1,look:[0,3,0],pause:.2},{x:.1,z:1.0,look:[0,4.2,0],pause:1.7}];
 function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600)}
 function stopGuide(){guide=false;$('#route').classList.remove('active');$('#center').classList.remove('active')}
 function startGuide(type){if(guide&&guideMode===type){stopGuide();return;}guide=true;guideIndex=0;guidePause=0;guideMode=type;$('#route').classList.toggle('active',type==='ring');$('#center').classList.toggle('active',type==='center');toast(type==='ring'?'記録の回廊を歩きます':'空白の中心へ歩きます。')}
 function reset(){stopGuide();camera.position.set(home.x,1.7,home.z);yaw=home.yaw;pitch=home.pitch;toast('入口へ戻りました')}

 function modal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.add('open')}
 function nearest(){let n=null,min=Infinity;for(const p of archive){const dist=Math.hypot(p.x-camera.position.x,p.z-camera.position.z);if(dist<min){n=p;min=dist}}return {p:n,dist:min}}
 function detail(){const {p,dist}=nearest();if(!p||dist>3.6){toast('資料にもう少し近づいてください');return}const item=slices[p.i];modal('史料風イメージ — 創作素材',`<img src="${item.src}" alt="生成された架空の史料風画像"><p>これはCRITT Museumの仮想展覧会のために生成された視覚素材です。人物・記録・スコアカードの実在性は確認されておらず、史実や個人の証言として扱うことはできません。</p>`)}
 $('#detail').onclick=detail;
 $('#info').onclick=()=>modal('《スコアカードにない名前》 — 作品ノート',`<p>試合の記録には、得点やウィケット数が残る。しかし競技を支えた労働、観客、地域の営み、記録に現れない関係は、スコアカードだけでは読み取れない。</p><p>この作品は「誰が記録され、誰が記録されないのか」を問います。吊り下げられた史料風の画像の間を歩き、中央の何も書かれていない展示へ向かう構成です。</p><p><strong>資料について：</strong>現在の画像はAIで制作した架空の展示イメージです。特定の史実や人物を説明する資料ではありません。実在する資料の採用・出典確認は今後の調査段階で行います。</p>`);
 $('#ref').onclick=()=>modal('作品07 — 初期コンセプト画像',`<img src="${original}" alt="生成された初期展示イメージ"><p>この原画は創作ビジュアルです。写っている書類や人物を実在の史料として引用していません。回遊展示ではその一部を切り出して再構成しています。</p>`);
 $('#close').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};
 function toggleUI(){ui=!ui;document.body.classList.toggle('no-ui',!ui)}$('#hide').onclick=toggleUI;
 renderer.domElement.addEventListener('pointerdown',e=>{drag=true;prev={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture?.(e.pointerId)});
 renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;stopGuide();yaw-=(e.clientX-prev.x)*.0039;pitch-=(e.clientY-prev.y)*.0035;pitch=THREE.MathUtils.clamp(pitch,-1.2,1.15);prev={x:e.clientX,y:e.clientY}});

 window.addEventListener('keydown',e=>{if(e.target?.tagName==='BUTTON')return;const k=e.key.toLowerCase();if(k.startsWith('arrow')||k===' ')e.preventDefault();if(k==='escape'){stopGuide();$('#modal').classList.remove('open')}if(k==='h'&&!e.repeat)toggleUI();if(k==='g'&&!e.repeat)startGuide('ring');if(k==='c'&&!e.repeat)startGuide('center');if(k==='enter'&&!e.repeat)detail();keys.add(k);if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k))stopGuide()});

 function angleDelta(a,b){let d=(b-a+Math.PI)%(2*Math.PI);if(d<0)d+=2*Math.PI;return d-Math.PI}
 function motion(dt){
  if(guide){const path=guideMode==='ring'?circlePath:centerPath,t=path[guideIndex];if(!t){stopGuide();return}
   const dx=t.x-camera.position.x,dz=t.z-camera.position.z,dist=Math.hypot(dx,dz);if(dist>.14){camera.position.x+=dx/dist*Math.min(dist,dt*2.3);camera.position.z+=dz/dist*Math.min(dist,dt*2.3)}else{guidePause+=dt;if(guidePause>t.pause){guideIndex++;guidePause=0;if(guideIndex>=path.length){stopGuide();toast('この地点から自由に鑑賞できます')}}}
   const dy=Math.atan2(t.look[0]-camera.position.x,camera.position.z-t.look[2]),dp=Math.atan2(t.look[1]-1.7,Math.max(.01,Math.hypot(t.look[0]-camera.position.x,t.look[2]-camera.position.z)));
   yaw+=angleDelta(yaw,dy)*Math.min(1,dt*2);pitch+=(dp-pitch)*Math.min(1,dt*2);
  }else{
   if(keys.has('q'))yaw+=dt*1.45;if(keys.has('e'))yaw-=dt*1.45;
   if(keys.has('r'))pitch=Math.min(1.15,pitch+dt*1.15);if(keys.has('f'))pitch=Math.max(-1.2,pitch-dt*1.15);
   const f=(keys.has('w')||keys.has('arrowup')?1:0)-(keys.has('s')||keys.has('arrowdown')?1:0);
   const s=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0);
   const norm=Math.hypot(f,s)||1,speed=3.1*(keys.has('shift')?1.4:1);
   camera.position.x+=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt/norm;
   camera.position.z+=(-Math.cos(yaw)*f+Math.sin(yaw)*s)*speed*dt/norm;
  }
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-15.6,15.6);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-14.8,14.8);camera.position.y=1.7;
  camera.lookAt(camera.position.x+Math.sin(yaw)*Math.cos(pitch),1.7+Math.sin(pitch),camera.position.z-Math.cos(yaw)*Math.cos(pitch));
 }
 let phase=0;
 function art(dt){phase+=dt;
  const r=Math.hypot(camera.position.x,camera.position.z),silence=1-THREE.MathUtils.smoothstep(r,2.3,8.8);
  for(const p of archive){p.mat.opacity=THREE.MathUtils.lerp(.90,.26,silence*.82)}
  voidSheets.forEach(({mat,edge,i})=>{mat.opacity=.06+.27*silence+.018*Math.sin(phase*.45+i*.5);edge.opacity=.09+.32*silence});
  quietLight.intensity=12+48*silence;lamps.forEach((lamp,i)=>lamp.intensity=12+6*Math.sin(phase*.35+i*.7));
  if(r<2.6){$('#zone').textContent='中心｜名前のない空白';$('#near').textContent='何も書かれていない展示面'}
  else if(r<6.5){$('#zone').textContent='内側｜記録から離れる';$('#near').textContent='写真の光が少しずつ遠のく'}
  else{$('#zone').textContent='回廊｜吊り下げられた記録';const {dist}=nearest();$('#near').textContent=dist<3.6?'近くの画像をEnterで確認できます':'史料風の画像へ近づけます'}
 }
 let prevFrame=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.045,(now-prevFrame)/1000);prevFrame=now;motion(dt);art(dt);renderer.render(scene,camera)}
 requestAnimationFrame(animate);$('#loading').remove();toast('回廊を歩き、中央の空白へ向かってください。');
}catch(e){$('#loading').textContent='3D展示の初期化に失敗しました。\n'+(e?.message||e);console.error(e)}
</script></body></html>
