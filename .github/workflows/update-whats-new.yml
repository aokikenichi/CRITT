name: Update CRITT Whats New

on:
  push:
    paths:
      - '.github/workflows/update-whats-new.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update What's New
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<div class="news-list"><a class="news-item" href="cricket-map.html"><time class="news-date" datetime="2026-08-16">2026.08.16</time><div><span class="news-type">CRICKET MAP</span><span class="news-title">「日本のクリケット地図」を公開</span></div><span class="news-arrow">地図を見る →</span></a><a class="news-item" href="t20-men.html"><time class="news-date" datetime="2026-08-09">2026.08.09</time><div><span class="news-type">DATA ANALYTICS</span><span class="news-title">「120球で見る、日本の現在地。— 男子版」を公開</span></div><span class="news-arrow">分析を見る →</span></a><a class="news-item" href="games/six-balls/"><time class="news-date" datetime="2026-08-02">2026.08.02</time><div><span class="news-type">BROWSER GAME</span><span class="news-title">1人用クリケットカードゲーム『LAST OVER：SIX BALLS』を公開</span></div><span class="news-arrow">ゲームで遊ぶ →</span></a></div>'''
          new = '''<div class="news-list"><a class="news-item" href="guide/history.html"><time class="news-date" datetime="2026-08-23">2026.08.23</time><div><span class="news-type">CRICKET GUIDE</span><span class="news-title">「日本のクリケット史」を公開</span></div><span class="news-arrow">歴史を読む →</span></a><a class="news-item" href="cricket-map.html"><time class="news-date" datetime="2026-08-16">2026.08.16</time><div><span class="news-type">CRICKET MAP</span><span class="news-title">「日本のクリケット地図」を公開</span></div><span class="news-arrow">地図を見る →</span></a><a class="news-item" href="t20-men.html"><time class="news-date" datetime="2026-08-09">2026.08.09</time><div><span class="news-type">DATA ANALYTICS</span><span class="news-title">「120球で見る、日本の現在地。— 男子版」を公開</span></div><span class="news-arrow">分析を見る →</span></a></div>'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update What's New with cricket history"
          git push
