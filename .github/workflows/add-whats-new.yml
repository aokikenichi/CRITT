name: Add CRITT What's New

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-whats-new.yml"

permissions:
  contents: write

jobs:
  update-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update history and homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          history_path = Path("history.html")
          history = history_path.read_text(encoding="utf-8")
          history_anchor = '        <li class="event"><time class="date" datetime="2026-07-20">7.20</time><div class="event-copy"><p>「<a href="guide/"><strong>クリケットガイド</strong></a>」ページを開設し、第一弾として「<a href="guide/wicket.html"><strong>三本のStumps、二本のBails</strong></a>」を公開</p></div></li>'
          history_item = '\n        <li class="event"><time class="date" datetime="2026-07-24">7.24</time><div class="event-copy"><p>『Last Over』第6話を公開</p></div></li>'
          if 'datetime="2026-07-24"' not in history:
              if history_anchor not in history:
                  raise RuntimeError("History insertion point was not found")
              history = history.replace(history_anchor, history_anchor + history_item, 1)
              history_path.write_text(history, encoding="utf-8")

          index_path = Path("index.html")
          html = index_path.read_text(encoding="utf-8")
          css_anchor = '.about{padding:92px 0;'
          whats_new_css = '''.whats-new{padding:54px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--paper2)}.whats-new-grid{display:grid;grid-template-columns:.52fr 1.48fr;gap:44px;align-items:start}.whats-new h2{margin:8px 0 0;font:800 clamp(2.6rem,5vw,5rem)/.92 Georgia,serif;letter-spacing:-.05em}.news-list{border-top:1px solid var(--ink)}.news-item{display:grid;grid-template-columns:108px minmax(0,1fr) auto;gap:20px;align-items:center;padding:18px 8px;border-bottom:1px solid var(--line);transition:.2s}.news-item:hover{background:rgba(255,255,255,.38)}.news-date{font:700 .9rem/1.2 Georgia,serif;color:var(--red)}.news-type{display:block;margin-bottom:4px;color:var(--teal);font-size:.62rem;font-weight:900;letter-spacing:.14em}.news-title{font-size:.9rem;font-weight:800}.news-arrow{color:var(--red);font-size:.7rem;font-weight:900;white-space:nowrap}.news-more{margin-top:18px;text-align:right}.news-more a{color:var(--red);font-size:.74rem;font-weight:900;text-decoration:underline;text-underline-offset:4px}@media(max-width:920px){.whats-new-grid{grid-template-columns:1fr}}@media(max-width:640px){.news-item{grid-template-columns:1fr;gap:5px;padding:16px 4px}.news-arrow{margin-top:4px}.news-more{text-align:left}}\n'''
          if '.whats-new{' not in html:
              if css_anchor not in html:
                  raise RuntimeError("Homepage CSS insertion point was not found")
              html = html.replace(css_anchor, whats_new_css + css_anchor, 1)

          hero_end = '</div></div></section>\n<section class="about">'
          whats_new_html = '''</div></div></section>
<section class="whats-new" aria-labelledby="whats-new-title"><div class="wrap whats-new-grid"><div><span class="stamp">What's New</span><h2 id="whats-new-title">新しく、<br>加わったもの。</h2></div><div><div class="news-list"><a class="news-item" href="#stories"><time class="news-date" datetime="2026-07-24">2026.07.24</time><div><span class="news-type">MANGA</span><span class="news-title">『Last Over』第6話を公開</span></div><span class="news-arrow">物語を見る →</span></a><a class="news-item" href="guide/"><time class="news-date" datetime="2026-07-20">2026.07.20</time><div><span class="news-type">CRICKET GUIDE</span><span class="news-title">クリケットガイドを開設。「三本のStumps、二本のBails」を公開</span></div><span class="news-arrow">ガイドを見る →</span></a><a class="news-item" href="links.html"><time class="news-date" datetime="2026-07-14">2026.07.14</time><div><span class="news-type">LINKS</span><span class="news-title">「日本のクリケットとつながる。」リンク集を公開</span></div><span class="news-arrow">リンク集を見る →</span></a></div><div class="news-more"><a href="history.html">その他、過去の更新履歴は「CRITTの歩み」へ →</a></div></div></div></section>
<section class="about">'''
          if 'id="whats-new-title"' not in html:
              if hero_end not in html:
                  raise RuntimeError("Homepage HTML insertion point was not found")
              html = html.replace(hero_end, whats_new_html, 1)

          index_path.write_text(html, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/add-whats-new.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.html index.html .github/workflows/add-whats-new.yml
          git commit -m "Add latest updates to CRITT homepage"
          git push
