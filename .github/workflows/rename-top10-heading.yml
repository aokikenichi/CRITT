name: Rename T20I Top10 heading

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rename-top10-heading.yml"

permissions:
  contents: write

jobs:
  update-heading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace heading text
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("t20i-rankings.html")
          html = path.read_text(encoding="utf-8")
          old = '<header><h3>MEN</h3><small>UPDATED 2026.07.23</small></header>'
          new = '<header><h3>世界のTop10</h3><small>UPDATED 2026.07.23</small></header>'
          if old not in html:
              raise RuntimeError("Target heading was not found")
          html = html.replace(old, new, 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/rename-top10-heading.yml

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t20i-rankings.html .github/workflows/rename-top10-heading.yml
          git commit -m "Rename T20I world top 10 heading"
          git push
