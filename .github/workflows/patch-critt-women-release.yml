name: Patch CRITT predictor header

on:
  push:
    paths:
      - '.github/workflows/patch-critt-women-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make CRITT header link back to home
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('japan-t20-predictor.html')
          s = p.read_text(encoding='utf-8')
          old = '''    <a class="brand" href="#overview" data-route="overview" aria-label="概要へ">
      <span class="brand-mark" aria-hidden="true">JP</span>
      <span><strong>Japan T20</strong><small>WASP-style Lab</small></span>
    </a>'''
          new = '''    <a class="brand" href="index.html" aria-label="CRITTトップへ">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span><strong>CRITT</strong><small>Japan T20 Predictor</small></span>
    </a>'''
          if new in s:
              print('already patched')
          elif old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('patched')
          else:
              raise SystemExit('header anchor not found')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add japan-t20-predictor.html
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Fix T20 predictor CRITT header navigation'
            git pull --rebase origin main
            git push
          fi
