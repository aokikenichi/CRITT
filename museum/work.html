<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>作品鑑賞 — CRITT Museum α試作</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/museum.css">
  <link rel="stylesheet" href="css/original-viewer.css">
  <script src="js/museum-shell.js" defer></script>
</head>
<body data-page="work">
  <a class="skip-link" href="#stage">作品表示領域へ移動</a>
  <header id="shell-header" class="shell-header">
    <div class="shell-heading">
      <a class="shell-brand" href="index.html"><strong>CRITT MUSEUM</strong><span lang="en">BEYOND THE BOUNDARY</span></a>
      <div class="work-heading"><span id="work-id" class="work-id">—</span><h1 id="work-title">作品を読み込み中</h1><span id="work-status" class="work-status">準備中</span></div>
    </div>
    <div class="shell-toolbar" role="toolbar" aria-label="共通鑑賞メニュー">
      <button id="about-button" type="button">作品について</button>
      <div class="originals-action"><button id="originals-button" type="button" disabled aria-describedby="originals-status">原画を見る</button><span id="originals-status">原画未登録</span></div>
      <button id="help-button" type="button">操作方法</button>
      <button id="hide-ui" class="quiet-button" type="button" disabled>UIを隠す</button>
    </div>
  </header>
  <main id="stage" class="stage" tabindex="-1" aria-label="作品表示領域">
    <p id="load-status" class="load-status" role="status">作品を読み込んでいます。</p>
    <iframe id="artwork-frame" title="CRITT Museumの作品" tabindex="0" hidden></iframe>
    <article id="missing-work" class="missing-work" hidden>
      <p class="eyebrow">AWAITING THE SOURCE</p>
      <h2>原本未取得</h2>
      <p>現在収録準備中です。作品HTMLの原本が未取得のため、ここでは鑑賞できません。</p>
      <p>作品の所在・採用版を確認後に接続します。</p>
    </article>
    <noscript><p class="error-message">鑑賞ページにはJavaScriptが必要です。<a href="index.html">作品一覧へ戻る</a></p></noscript>
  </main>
  <footer id="shell-footer" class="shell-footer">
    <div class="viewing-controls">
      <div id="mode-controls" class="mode-controls" role="group" aria-label="鑑賞モード" hidden>
        <button type="button" data-mode="manual">手動鑑賞</button>
        <button type="button" data-mode="auto">自動鑑賞</button>
        <button type="button" data-mode="pause">一時停止</button>
      </div>
      <p id="mode-hint">作品画面内で操作してください。</p>
      <p id="reduced-motion-note" class="motion-note" hidden>動きを抑える設定が有効です。自動鑑賞は必要なときだけ開始してください。</p>
    </div>
    <nav class="work-navigation" aria-label="作品の移動">
      <a id="previous-work" aria-disabled="true"><span aria-hidden="true">←</span> 前の作品</a>
      <a class="list-link" href="index.html">作品一覧へ</a>
      <a id="next-work" aria-disabled="true">次の作品 <span aria-hidden="true">→</span></a>
    </nav>
  </footer>
  <button id="show-ui" class="show-ui" type="button" hidden>UIを表示</button>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="info-title">
    <div class="dialog-heading"><h2 id="info-title">作品について</h2><button type="button" data-close-dialog aria-label="ダイアログを閉じる">閉じる <span aria-hidden="true">×</span></button></div>
    <div id="info-content" class="info-content"></div>
  </dialog>
</body>
</html>
